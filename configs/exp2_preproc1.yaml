experiment_id: "exp2_preproc1"
experiment_name: "Experiment 2: Preprocessing 1 (LAB-CLAHE + Gaussian Filtering)"

preprocessing:
  name: "clahe_lab"
  description: "3x3 Gaussian smoothing followed by Contrast Limited Adaptive Histogram Equalization (CLAHE) on the Luminance (L) channel in CIE LAB space."
  params:
    gaussian_ksize: 3
    gaussian_sigma: 0.5
    clip_limit: 2.0
    tile_grid_size: 8

model:
  type: "yolo"
  architecture: "yolov8m.pt"
  imgsz: 640

training:
  epochs: 80
  batch_size: 16
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  cos_lr: true
  patience: 20
  seed: 42
  workers: 4
  augmentation_summary: "Mosaic (1.0), Horizontal Flip (0.5), HSV-Hue (0.015), HSV-Sat (0.7), HSV-Val (0.4), Scale (0.5)"
  loss_summary: "CIoU (Box Regression) + DFL (Distribution Focal Loss) + BCE (Classification)"

huggingface:
  repo_id: "Muhammad-Huzzaifa/colonoscopy-polyp-detection"
  push_weights: true